name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # ── Change detection ───────────────────────────────────────────────
  # A pnpm workspace install (in either job) installs the whole monorepo,
  # so the only thing worth gating on is *which side's tasks* to run.
  changes:
    name: "Detect changes"
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'src/api/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/**'
            web:
              - 'src/**'
              - '!src/api/**'
              - 'public/**'
              - 'tests/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'next.config.ts'
              - 'tsconfig.json'
              - 'tailwind.config.js'
              - 'postcss.config.mjs'
              - 'eslint.config.mjs'
              - 'jest.config.ts'
              - 'jest.setup.ts'
              - 'playwright.config.ts'
              - 'components.json'
              - '.github/**'

  # ── Backend ────────────────────────────────────────────────────────
  api-checks:
    name: "API · Lint + Build + Unit"
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run lint
      - run: pnpm run build # nest build also type-checks (replaces tsc --noEmit)
      - run: npx jest --ci --forceExit

  api-e2e:
    name: "API · E2E"
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: src/api
    env:
      JWT_SECRET: ci-test-jwt-secret
      JWT_EXPIRES_IN: 1h
      GOOGLE_CLIENT_ID: ci-test-google-client-id
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx jest --config ./test/jest-e2e.json --ci --forceExit

  # ── Frontend ───────────────────────────────────────────────────────
  web-checks:
    name: "Web · Lint + Build + Unit"
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm run lint
      - run: pnpm run build # next build also type-checks (replaces tsc --noEmit)
      - run: npx jest --config jest.config.ts --ci

  web-e2e:
    name: "Web · E2E"
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright (browser + deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright OS deps (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm run test:e2e:web
      - if: always()
        id: upload-playwright-report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
      - if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PLAYWRIGHT_ARTIFACT_URL: ${{ steps.upload-playwright-report.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const marker = '<!-- playwright-screenshots -->';
            const root = 'test-results';
            const screenshots = [];

            function walk(dir) {
              if (!fs.existsSync(dir)) return;

              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const fullPath = path.join(dir, entry.name);

                if (entry.isDirectory()) {
                  walk(fullPath);
                } else if (entry.isFile() && entry.name.endsWith('.png')) {
                  screenshots.push(fullPath);
                }
              }
            }

            walk(root);

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactUrl = process.env.PLAYWRIGHT_ARTIFACT_URL || runUrl;
            const screenshotText = screenshots.length === 1
              ? '1 screenshot PNG'
              : `${screenshots.length} screenshots PNG`;

            const body = `${marker}
            ## Playwright screenshots

            Se capturaron ${screenshotText} en los tests end-to-end.

            Artifact: [playwright-report](${artifactUrl})

            Nota: no se pueden pegar las imagenes inline desde un artifact de GitHub Actions, porque el artifact se descarga como ZIP y no expone URLs publicas directas para cada PNG.`;

            const issue_number = context.issue.number || context.payload.pull_request?.number;
            if (!issue_number) {
              core.warning('No pull request number found; skipping screenshot comment.');
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

  # ── Security ───────────────────────────────────────────────────────
  audit:
    name: "Security audit"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm audit --prod || true
        name: Audit root dependencies
      - run: pnpm --filter watch-together-backend audit --prod || true
        name: Audit API dependencies

  # ── Branch-protection gate ─────────────────────────────────────────
  # Single required check: passes only if no needed job failed/was cancelled.
  # Skipped side-jobs (path-filtered out) count as success.
  ci:
    name: "CI"
    if: always()
    needs: [changes, api-checks, api-e2e, web-checks, web-e2e, audit]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Verify no job failed
        run: |
          results="${{ needs.changes.result }} ${{ needs.api-checks.result }} ${{ needs.api-e2e.result }} ${{ needs.web-checks.result }} ${{ needs.web-e2e.result }} ${{ needs.audit.result }}"
          echo "Job results: $results"
          if echo "$results" | grep -qE 'failure|cancelled'; then
            echo "::error::At least one required job failed or was cancelled."
            exit 1
          fi
          echo "All required jobs passed (or were skipped)."
