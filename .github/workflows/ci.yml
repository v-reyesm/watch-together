name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  NODE_VERSION: "20"

jobs:
  # ── Backend ────────────────────────────────────────────────────────
  api-lint:
    name: "API · Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  api-typecheck:
    name: "API · Type check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit

  api-unit-tests:
    name: "API · Unit tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx jest --no-cache --forceExit

  api-e2e-tests:
    name: "API · E2E tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    env:
      JWT_SECRET: ci-test-jwt-secret
      JWT_EXPIRES_IN: 1h
      GOOGLE_CLIENT_ID: ci-test-google-client-id
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx jest --config ./test/jest-e2e.json --no-cache --forceExit

  api-build:
    name: "API · Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  # ── Frontend ───────────────────────────────────────────────────────
  web-lint:
    name: "Web · Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  web-typecheck:
    name: "Web · Type check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rm -rf .next
      - run: npx tsc --noEmit

  web-tests:
    name: "Web · Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx jest --config jest.config.ts --no-cache

  web-e2e:
    name: "Web · E2E"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e:web
      - if: always()
        id: upload-playwright-report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
      - if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PLAYWRIGHT_ARTIFACT_URL: ${{ steps.upload-playwright-report.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const marker = '<!-- playwright-screenshots -->';
            const root = 'test-results';
            const screenshots = [];

            function walk(dir) {
              if (!fs.existsSync(dir)) return;

              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const fullPath = path.join(dir, entry.name);

                if (entry.isDirectory()) {
                  walk(fullPath);
                } else if (entry.isFile() && entry.name.endsWith('.png')) {
                  screenshots.push(fullPath);
                }
              }
            }

            walk(root);

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactUrl = process.env.PLAYWRIGHT_ARTIFACT_URL || runUrl;
            const screenshotText = screenshots.length === 1
              ? '1 screenshot PNG'
              : `${screenshots.length} screenshots PNG`;

            const body = `${marker}
            ## Playwright screenshots

            Se capturaron ${screenshotText} en los tests end-to-end.

            Artifact: [playwright-report](${artifactUrl})

            Nota: no se pueden pegar las imagenes inline desde un artifact de GitHub Actions, porque el artifact se descarga como ZIP y no expone URLs publicas directas para cada PNG.`;

            const issue_number = context.issue.number || context.payload.pull_request?.number;
            if (!issue_number) {
              core.warning('No pull request number found; skipping screenshot comment.');
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

  web-build:
    name: "Web · Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  # ── Security ───────────────────────────────────────────────────────
  audit:
    name: "Security audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod || true
        name: Audit root dependencies
      - run: pnpm --filter watch-together-backend audit --prod || true
        name: Audit API dependencies
